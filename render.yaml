services:
  - type: web
    name: liveflightwatch-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
